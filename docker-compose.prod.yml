# Docker Compose for Production
# Uses docker-compose.yml as base
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

services:
  postgres:
    container_name: informatics-go-green-db-prod
    restart: always
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: informatics-go-green-backend-prod
    restart: always
    environment:
      NODE_ENV: production
      API_URL: ${API_URL}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "9061:3001"
    volumes:
      - uploads_data:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - internal
      - web

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: informatics-go-green-frontend-prod
    restart: always
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
    ports:
      - "9060:3000"
    networks:
      - web

  mailpit:
    image: axllent/mailpit
    container_name: informatics-go-green-mailpit
    restart: always
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - internal
      - web

volumes:
  postgres_data_prod:
  uploads_data:

networks:
  internal:
    driver: bridge
  web:
    driver: bridge
