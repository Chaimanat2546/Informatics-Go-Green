# Base Docker Compose for Informatics Go Green
# Contains common configurations for all environments

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-goapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-YourSecurePassword123!}
      POSTGRES_DB: ${POSTGRES_DB:-informatics_go_green}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-goapp}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-YourSecurePassword123!}
      DATABASE_NAME: ${POSTGRES_DB:-informatics_go_green}
      JWT_SECRET: ${JWT_SECRET:-G6pYhJmaddbDymizHXUkVPSdB3}
      JWT_EXPIRES_IN_SECONDS: ${JWT_EXPIRES_IN_SECONDS:-604800}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    depends_on:
      - backend
